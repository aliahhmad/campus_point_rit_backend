site_name: CampusPoint Backend
site_description: Campus requests, responses, escrowed rewards, two-phase commit, and recovery.
repo_url: https://github.com/aliahhmad/rit_csci_652_dist_project
repo_name: aliahhmad/rit_csci_652_dist_project
copyright: CampusPoint — includes MIT-licensed FastAPI Template components

theme:
  name: material
  palette:
    primary: light-blue
    accent: blue
  features:
    - navigation.footer
    - content.code.copy
    - navigation.tracking
    - navigation.indexes
    - navigation.top
    - toc.follow

plugins:
  - search

dev_addr: "127.0.0.1:9000"

markdown_extensions:
  - admonition
  - footnotes
  - pymdownx.snippets:
      check_paths: true
  - docs.hooks.google_style_notes
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - md_in_html
  - pymdownx.highlight:
      linenums: false
  - attr_list
  - tables
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - CampusPoint: index.md
  - Quick Start: quick-start.md
  - Architecture: project-organization.md
  - Setup:
      - Installation: usage/installation.md
      - Environment Settings: usage/configuration/environment.md
      - Dependencies: usage/configuration/setup.md
      - Databases and Migrations: usage/configuration/database.md
      - Load Campus Locations: development/locations.md
      - Upgrade Notes: important.md
  - Request Workflows:
      - Request Creation and Escrow: development/requests.md
      - Request Feed and Moderation: development/request-feed.md
      - Responses: development/responses.md
      - Acceptance and Reputation: development/acceptance.md
      - Expiry, Refunds, and Conflicts: development/expiration.md
      - Administrator Resolution: development/conflict-resolution.md
      - Demo Walkthroughs: tutorials.md
  - Transactions and Recovery:
      - Two-Phase Commit: development/two-phase-commit.md
      - Recovery Workers: development/recovery.md
      - Migrations and Testing: development/testing.md
  - Accounts:
      - Authentication and User APIs: usage/user-management.md
      - Create and Verify Users: usage/add-user.md
      - CLI Account Control: usage/user-control.md
      - Wallet Initialization: development/wallets.md
      - Backend API Keys: usage/api-keys.md
  - Development and Operations:
      - Containers: development/docker.md
      - Host API Processes: development/local.md
      - Demo Deployment: deployment/deployment.md
      - Troubleshooting and SQL: troubleshooting.md
      - CI Coverage: development/ci.md
      - Optional SQLAdmin: usage/admin-panel.md
      - Optional Caching: usage/caching.md
      - Authentication Rate Limits: usage/rate-limiting.md
      - Metrics and Logs: usage/metrics.md
  - API Reference:
      - Endpoint Catalog: reference/api.md
      - Live Swagger: reference/swagger.md
  - Project:
      - Metadata: customization/meta.md
      - Email and HTML Templates: customization/templates.md
      - Maintain Documentation: development/documentation.md
      - Current Limitations: future.md
      - Contributing: contributing.md
      - Security Reporting: security.md
      - Code of Conduct: code-of-conduct.md
      - CampusPoint Changes: changelog.md
      - License: license.md
      - Upstream History: history/template-changelog.md
